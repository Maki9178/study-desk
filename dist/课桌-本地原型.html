debar-bottom p{margin-bottom:4px}.sidebar-bottom small{font-size:13px}.sidebar-bottom button{margin-top:18px;width:100%;background:transparent;border-color:#425376;color:#e5ecfa}main{max-width:1440px;width:100%;padding:35px 42px}header{display:flex;justify-content:space-between;align-items:center;gap:20px}h1{font-size:29px;letter-spacing:-1px;line-height:1.3;margin:5px 0 0}h2{font-size:20px;margin:0}.eyebrow{color:var(--muted);font-size:14px}.header-actions{display:flex;gap:8px;flex-wrap:wrap}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin:28px 0}.stat{background:white;border:1px solid var(--line);border-radius:13px;padding:18px 22px}.stat strong{display:block;font-size:30px;line-height:1.4}.stat span{color:var(--muted);font-size:14px}.stat.urgent strong{color:var(--red)}.toolbar{display:flex;gap:12px;margin-bottom:27px}.toolbar input{flex:1}.toolbar select{width:160px}.section-head{display:flex;justify-content:space-between;align-items:center;margin:26px 0 14px;gap:12px}.section-head h2 span{font-size:14px;color:var(--muted);font-weight:400}.muted{color:var(--muted);font-size:14px}.task{display:flex;gap:14px;align-items:flex-start;background:white;padding:19px 21px;border:1px solid var(--line);border-radius:12px;margin-bottom:10px}.check{width:25px;height:25px;min-width:25px;padding:0;margin-top:3px;border-radius:7px;color:var(--green)}.task.done .check{background:#e5f5ed;border-color:#9ad0b7}.task.done h3{text-decoration:line-through;color:var(--muted)}.task-body{flex:1;min-width:0}.task h3{font-size:16px;margin:0 0 5px;overflow-wrap:anywhere}.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:14px;color:var(--muted)}.due{color:var(--blue)}.due.overdue{color:var(--red)}.task-notes{white-space:pre-wrap;font-size:14px;margin-top:8px;color:var(--muted);overflow-wrap:anywhere}.mini-actions{display:flex;gap:7px;flex-wrap:wrap}.mini-actions button,.mini-actions a{font-size:14px;padding:5px 9px;border:1px solid var(--line);border-radius:7px;background:#fff}.site-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.site{background:white;border:1px solid var(--line);border-radius:13px;padding:21px;display:flex;flex-direction:column;gap:12px}.site-top{display:flex;gap:12px;align-items:center}.site-icon{width:42px;height:42px;min-width:42px;background:#eaf0ff;color:var(--blue);font-size:20px;font-weight:700;display:grid;place-items:center;border-radius:11px}.site h3{font-size:17px;margin:0;overflow-wrap:anywhere}.site-domain{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.site-purpose{font-size:14px;min-height:23px;overflow-wrap:anywhere}.pill{font-size:12px;background:#eef2f8;color:#59677d;border-radius:5px;padding:3px 7px}.account{font-size:14px;background:#f7f9fc;border-radius:7px;padding:9px;overflow-wrap:anywhere}.site .mini-actions{margin-top:auto}.empty{border:1px dashed #bac8df;border-radius:13px;padding:32px;text-align:center;background:#f9fbfe;color:var(--muted)}.empty button{margin-top:12px}footer{margin-top:30px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}.text-btn{padding:0;background:transparent;border:0;font-size:14px;color:var(--blue)}dialog{border:0;border-radius:16px;padding:0;max-width:600px;width:calc(100% - 30px);max-height:90vh;box-shadow:0 20px 80px #10234540}dialog::backdrop{background:#0a16377d;backdrop-filter:blur(4px)}.modal{padding:28px}.modal label{display:block;font-size:14px;font-weight:500;margin:14px 0}.modal label input,.modal label select,.modal label textarea{display:block;margin-top:6px}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.dialog-head{display:flex;align-items:center;justify-content:space-between}.dialog-head button{padding:0 10px;font-size:24px}.actions{display:flex;justify-content:flex-end;gap:8px;margin-top:20px}.hint{font-size:13px;color:var(--muted);line-height:1.7}.error{color:var(--red);font-size:14px}.candidate{border:1px solid var(--line);border-radius:9px;padding:12px;margin-top:12px}.candidate label{display:flex;gap:10px;align-items:flex-start;margin:0}.candidate input[type=checkbox]{width:auto;margin-top:5px}.candidate input[type=datetime-local]{margin-top:8px}#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#152444;color:white;padding:11px 22px;border-radius:9px;z-index:20;display:none;max-width:90vw}body.locked .shell{filter:blur(5px);pointer-events:none}@media(max-width:1150px){main{padding:28px}.site-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.header-actions button{font-size:14px}}@media(max-width:760px){.shell{display:block}aside{height:auto;position:static;padding:15px 18px}.brand{font-size:20px}.brand small,.sidebar-bottom{display:none}nav{display:flex;margin-top:14px;gap:6px}nav button{flex:1;text-align:center;padding:8px}.logo{padding:3px 9px}main{padding:22px 16px}header{align-items:flex-start;flex-direction:column}h1{font-size:25px}.stats{grid-template-columns:repeat(2,1fr);gap:10px;margin:20px 0}.stat{padding:12px 16px}.toolbar{flex-wrap:wrap;gap:8px}.toolbar input{flex-basis:100%}.toolbar select{flex:1;width:auto}.site-grid{grid-template-columns:1fr}.task{padding:15px;flex-wrap:wrap}.task>.mini-actions{margin-left:39px}.two{grid-template-columns:1fr;gap:0}.modal{padding:23px}.section-head{align-items:flex-start}.header-actions{width:100%}.header-actions button{flex:1;white-space:nowrap}}
</style></head>
<body><div class="shell"><aside><div class="brand"><span class="logo">课</span><div>课桌<small>STUDY DESK</small></div></div><nav><button class="active" data-view="overview">总览</button><button data-view="sites">我的网站</button><button data-view="tasks">作业清单</button></nav><div class="sidebar-bottom"><p>本地资料库</p><small>数据保存在当前浏览器<br>导出备份后可迁移设备</small><button id="lockBtn">锁定资料库</button></div></aside><main><header><div><div class="eyebrow">我的学习工作台</div><h1 id="viewTitle">今天先做什么？</h1></div><div class="header-actions"><button id="exportBtn">导出备份</button><button id="importBtn">导入备份</button><button class="primary" id="addTaskBtn">＋ 添加作业</button></div></header><div class="stats" id="stats"></div><div class="toolbar"><input id="search" placeholder="搜索网站、课程或作业" aria-label="搜索网站、课程或作业"><select id="categoryFilter" aria-label="网站分类"><option value="">全部分类</option><option>课程</option><option>作业</option><option>资料</option><option>工具</option><option>其他</option></select><select id="statusFilter" aria-label="作业状态"><option value="open">待完成作业</option><option value="all">所有作业</option><option value="done">已完成作业</option></select></div><section id="taskSection"><div class="section-head"><h2>作业清单 <span id="taskCount"></span></h2><span class="muted">按截止时间排列</span></div><div id="taskList"></div></section><section id="siteSection"><div class="section-head"><h2>网站入口 <span id="siteCount"></span></h2><button id="addSiteBtn">＋ 添加网站</button></div><div class="site-grid" id="siteList"></div></section><footer><span id="saveState">已加密保存到本地</span><button id="demoBtn" class="text-btn">加载示例</button><button id="readTasksBtn" class="text-btn">从网页文本读取作业</button></footer></main></div>
<dialog id="vaultDialog"><form id="vaultForm" class="modal"><div class="eyebrow">课桌 · 本地资料库</div><h2 id="vaultTitle"></h2><p id="vaultDesc" class="muted"></p><label>主密码<input id="masterPassword" type="password" autocomplete="current-password" minlength="10" required></label><label id="confirmLabel">再次输入<input id="confirmPassword" type="password" autocomplete="new-password"></label><p class="error" id="vaultError" role="alert"></p><button class="primary" id="unlockBtn">打开资料库</button><p class="hint">主密码用于加密本地数据，请妥善保管。忘记密码无法恢复；清除浏览器数据前请导出备份。</p></form></dialog>
<dialog id="siteDialog"><form id="siteForm" class="modal"><div class="dialog-head"><h2 id="siteDialogTitle">添加网站</h2><button type="button" data-close="siteDialog" aria-label="关闭">×</button></div><input name="id" type="hidden"><div class="two"><label>网站名称<input name="name" required maxlength="100" placeholder="如：大学物理课程平台"></label><label>分类<select name="category"><option>课程</option><option>作业</option><option>资料</option><option>工具</option><option>其他</option></select></label></div><label>网站地址<input name="url" type="url" required placeholder="https://..."></label><label>用途<input name="purpose" placeholder="看课件、交作业、查看通知…" maxlength="200"></label><label>作业页面地址（选填）<input name="assignmentUrl" type="url" placeholder="可直接跳到作业列表"></label><div class="two"><label>登录账号<input name="account" autocomplete="off" placeholder="学号 / 邮箱 / 用户名"></label><label>登录密码（选填）<input name="password" type="password" autocomplete="new-password" placeholder="加密保存"></label></div><label>备注<textarea name="notes" rows="2" placeholder="登录方式、提交要求等"></textarea></label><p class="hint">打开网站后使用浏览器登录。此原型可复制账号和密码，不会自动登录。</p><div class="actions"><button type="button" data-close="siteDialog">取消</button><button class="primary">保存网站</button></div></form></dialog>
<dialog id="taskDialog"><form id="taskForm" class="modal"><div class="dialog-head"><h2 id="taskDialogTitle">添加作业</h2><button type="button" data-close="taskDialog" aria-label="关闭">×</button></div><input name="id" type="hidden"><label>作业名称<input name="title" required maxlength="200" placeholder="如：运动学习题 第 7–15 题"></label><div class="two"><label>所属网站<select name="siteId" id="taskSiteSelect"></select></label><label>课程 / 项目<input name="course" placeholder="大学物理"></label></div><div class="two"><label>截止时间<input name="due" type="datetime-local"></label><label>状态<select name="status"><option value="open">待完成</option><option value="done">已完成</option></select></label></div><label>作业链接（选填）<input name="url" type="url" placeholder="https://..."></label><label>要求 / 备注<textarea name="notes" rows="3"></textarea></label><div class="actions"><button type="button" data-close="taskDialog">取消</button><button class="primary">保存作业</button></div></form></dialog>
<dialog id="readerDialog"><form id="readerForm" class="modal"><div class="dialog-head"><h2>从网页文本读取作业</h2><button type="button" data-close="readerDialog" aria-label="关闭">×</button></div><p class="muted">在网站上复制作业列表，粘贴到这里。每行生成一个候选作业，日期会尝试识别；确认后再保存。</p><label>所属网站<select id="readerSite"></select></label><label>网页文本<textarea id="readerText" rows="7" placeholder="运动学习题 截止 2026-10-08 23:59&#10;线性代数练习 截止 2026年10月10日"></textarea></label><button class="primary" type="submit">读取候选作业</button><div id="readerResults"></div><p class="hint">当前支持逐行文本导入。自动读取已登录网站需要为具体网站添加适配器。</p></form></dialog>
<input type="file" id="backupInput" accept="application/json,.json" hidden><div id="toast" role="status"></div><script>/* Local prototype. No requests to external services. See HANDOFF.md for adapter contracts. */
'use strict';
const STORAGE_KEY='study-desk.v1', ITERATIONS=250000;
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID(), empty=()=>({schemaVersion:1,sites:[],tasks:[]});
let data=empty(), key=null, envelope=null, view='overview', candidates=[], idleTimer, saveQueue=Promise.resolve();
const b64=a=>btoa(String.fromCharCode(...a)), unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const safeUrl=v=>{if(!v)return '';const u=new URL(v);if(!['https:','http:'].includes(u.protocol))throw Error('网址需要使用 http 或 https');return u.href;};
const localDate=d=>{const t=new Date(d);return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}T${String(t.getHours()).padStart(2,'0')}:${String(t.getMinutes()).padStart(2,'0')}`;};
async function derive(pass,salt){const raw=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITERATIONS,hash:'SHA-256'},raw,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);}
async function encryptState(snapshot,k,salt){const iv=crypto.getRandomValues(new Uint8Array(12));const cipher=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(JSON.stringify(snapshot)));return {format:'study-desk-vault',version:1,kdf:'PBKDF2-SHA256',iterations:ITERATIONS,salt,iv:b64(iv),ciphertext:b64(new Uint8Array(cipher))};}
function validateState(s){if(s?.schemaVersion!==1||!Array.isArray(s.sites)||!Array.isArray(s.tasks))throw Error('数据格式不受支持');const ids=new Set();for(const x of s.sites){if(typeof x.id!=='string'||ids.has(x.id)||typeof x.name!=='string'||!x.name)throw Error('网站数据不完整');ids.add(x.id);x.url=safeUrl(x.url);x.assignmentUrl=safeUrl(x.assignmentUrl);}const taskIds=new Set();for(const t of s.tasks){if(typeof t.id!=='string'||taskIds.has(t.id)||typeof t.title!=='string'||!t.title)throw Error('作业数据不完整');taskIds.add(t.id);t.url=safeUrl(t.url);if(!['open','done'].includes(t.status))throw Error('作业状态不受支持');if(t.due&&Number.isNaN(new Date(t.due).getTime()))throw Error('截止时间不正确');}return s;}
function validateEnvelope(v){if(v?.format!=='study-desk-vault'||v.version!==1||v.iterations!==ITERATIONS||typeof v.ciphertext!=='string'||unb64(v.salt).length!==16||unb64(v.iv).length!==12)throw Error('不是有效的加密备份');return v;}
function persist(){const snapshot=structuredClone(data),k=key,salt=envelope.salt;$('#saveState').textContent='正在保存…';const job=saveQueue.catch(()=>{}).then(async()=>{const e=await encryptState(snapshot,k,salt);localStorage.setItem(STORAGE_KEY,JSON.stringify(e));envelope=e;$('#saveState').textContent='已加密保存到本地';});saveQueue=job;return job;}
function toast(s){$('#toast').textContent=s;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',3500);}
function showVault(){document.body.classList.add('locked');const existing=localStorage.getItem(STORAGE_KEY);$('#vaultTitle').textContent=existing?'解锁你的资料库':'创建本地资料库';$('#vaultDesc').textContent=existing?'输入主密码，查看网站和作业。':'设置至少 10 位主密码，网站与登录信息会加密后保存。';$('#confirmLabel').hidden=!!existing;$('#confirmPassword').required=!existing;$('#masterPassword').minLength=existing?1:10;$('#vaultError').textContent='';$('#vaultForm').reset();if(!$('#vaultDialog').open)$('#vaultDialog').showModal();}
async function lock(){await saveQueue.catch(()=>{});clearTimeout(idleTimer);key=null;data=empty();for(const d of document.querySelectorAll('dialog[open]'))d.close();$('#siteForm').reset();$('#taskForm').reset();$('#readerText').value='';$('#readerResults').innerHTML='';candidates=[];render();showVault();}
function touch(){clearTimeout(idleTimer);if(key)idleTimer=setTimeout(()=>lock(),10*60*1000);}
$('#vaultDialog').addEventListener('cancel',e=>e.preventDefault());
$('#vaultForm').addEventListener('submit',async e=>{e.preventDefault();const btn=$('#unlockBtn');btn.disabled=true;try{if(!crypto.subtle)throw Error('浏览器不支持本地加密，请用新版 Chrome 或 Edge 打开');const pass=$('#masterPassword').value,raw=localStorage.getItem(STORAGE_KEY);if(raw){envelope=validateEnvelope(JSON.parse(raw));key=await derive(pass,unb64(envelope.salt));const plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(envelope.iv)},key,unb64(envelope.ciphertext));data=validateState(JSON.parse(new TextDecoder().decode(plain)));}else{if(pass!==$('#confirmPassword').value)throw Error('两次密码不一致');const salt=crypto.getRandomValues(new Uint8Array(16));key=await derive(pass,salt);envelope={salt:b64(salt)};data=empty();await persist();}$('#vaultForm').reset();$('#vaultDialog').close();document.body.classList.remove('locked');render();touch();}catch(err){key=null;$('#vaultError').textContent=err.name==='OperationError'?'主密码不正确，或备份已损坏。':err.message;}finally{btn.disabled=false;}});
function siteSelect(el,selected=''){el.innerHTML='<option value="">未关联网站</option>'+data.sites.map(s=>`<option value="${esc(s.id)}">${esc(s.name)}</option>`).join('');el.value=selected;}
function openSite(id){const s=data.sites.find(s=>s.id===id);$('#siteForm').reset();$('#siteDialogTitle').textContent=s?'编辑网站':'添加网站';if(s)for(const [k,v]of Object.entries(s)){const el=$('#siteForm').elements.namedItem(k);if(el)el.value=v??'';}$('#siteDialog').showModal();}
function openTask(id,siteId=''){const t=data.tasks.find(t=>t.id===id);$('#taskForm').reset();siteSelect($('#taskSiteSelect'),t?.siteId||siteId);$('#taskDialogTitle').textContent=t?'编辑作业':'添加作业';if(t)for(const[k,v]of Object.entries(t)){const el=$('#taskForm').elements.namedItem(k);if(el)el.value=k==='due'&&v?localDate(v):v??'';}$('#taskDialog').showModal();}
function dateLabel(t){if(!t.due)return '<span>未设置截止日期</span>';const d=new Date(t.due),late=t.status!=='done'&&d<Date.now();return `<span class="due ${late?'overdue':''}">${late?'已逾期 · ':''}${esc(d.toLocaleString('zh-CN',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}))}</span>`;}
function render(){const q=$('#search').value.trim().toLowerCase(),category=$('#categoryFilter').value,status=$('#statusFilter').value,now=Date.now();const open=data.tasks.filter(t=>t.status==='open'),soon=open.filter(t=>t.due&&new Date(t.due)>=now&&new Date(t.due)-now<=72*3600000),late=open.filter(t=>t.due&&new Date(t.due)<now);$('#stats').innerHTML=[['网站',data.sites.length],['待完成',open.length],['三天内截止',soon.length],['已逾期',late.length]].map(([l,n],i)=>`<div class="stat ${i===3&&n?'urgent':''}"><strong>${n}</strong><span>${l}</span></div>`).join('');const sites=data.sites.filter(s=>(!category||s.category===category)&&[s.name,s.purpose,s.account,s.notes].join(' ').toLowerCase().includes(q));const tasks=data.tasks.filter(t=>{const s=data.sites.find(s=>s.id===t.siteId);return(status==='all'||t.status===status)&&(!category||s?.category===category)&&[t.title,t.course,t.notes,s?.name].join(' ').toLowerCase().includes(q);}).sort((a,b)=>(a.due?new Date(a.due).getTime():Infinity)-(b.due?new Date(b.due).getTime():Infinity));$('#taskCount').textContent=`· ${tasks.length}`;$('#siteCount').textContent=`· ${sites.length}`;$('#taskList').innerHTML=tasks.length?tasks.map(t=>{const s=data.sites.find(s=>s.id===t.siteId),url=t.url||s?.assignmentUrl||s?.url;return `<article class="task ${t.status==='done'?'done':''}"><button class="check" data-action="toggle" data-id="${esc(t.id)}" aria-label="${t.status==='done'?'标记未完成':'标记已完成'}">${t.status==='done'?'✓':''}</button><div class="task-body"><h3>${esc(t.title)}</h3><div class="meta">${dateLabel(t)}<span>${esc(t.course||'未设置课程')}</span><span>${esc(s?.name||'未关联网站')}</span>${t.source==='text'?'<span class="pill">文本导入</span>':''}</div>${t.notes?`<div class="task-notes">${esc(t.notes)}</div>`:''}</div><div class="mini-actions">${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">打开作业</a>`:''}<button data-action="editTask" data-id="${esc(t.id)}">编辑</button><button data-action="deleteTask" data-id="${esc(t.id)}">删除</button></div></article>`;}).join(''):'<div class="empty">这里暂时没有符合条件的作业。<br><button data-action="newTask">添加第一份作业</button></div>';$('#siteList').innerHTML=sites.length?sites.map(s=>`<article class="site"><div class="site-top"><span class="site-icon">${esc(s.name.slice(0,1))}</span><div><h3>${esc(s.name)}</h3><div class="site-domain">${esc(new URL(s.url).hostname)}</div></div></div><div class="site-purpose">${esc(s.purpose||'点击编辑，记录这个网站的用途')}</div><div><span class="pill">${esc(s.category)}</span> <span class="muted">${data.tasks.filter(t=>t.siteId===s.id&&t.status==='open').length} 份待完成作业</span></div><div class="account">账号：${esc(s.account||'未填写')}<br><span class="muted">密码：${s.password?'已加密保存':'未保存'}</span></div><div class="mini-actions"><a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer">打开网站</a><button data-action="newSiteTask" data-id="${esc(s.id)}">加作业</button><button data-action="editSite" data-id="${esc(s.id)}">编辑</button>${s.account?`<button data-action="copyAccount" data-id="${esc(s.id)}">复制账号</button>`:''}${s.password?`<button data-action="copyPassword" data-id="${esc(s.id)}">复制密码</button>`:''}<button data-action="deleteSite" data-id="${esc(s.id)}">删除</button></div></article>`).join(''):'<div class="empty">把常用网站集中到这里。<br><button data-action="newSite">添加第一个网站</button></div>';$('#taskSection').hidden=view==='sites';$('#siteSection').hidden=view==='tasks';$('#viewTitle').textContent={overview:'今天先做什么？',sites:'常用网站，一处找到',tasks:'把作业安排清楚'}[view];}
async function copy(v){try{await navigator.clipboard.writeText(v);toast('已复制');}catch{toast('浏览器禁止复制，请在编辑窗口中手动复制。');}}
document.addEventListener('click',async e=>{touch();const b=e.target.closest('button');if(!b)return;if(b.dataset.close){$('#'+b.dataset.close).close();return;}if(b.dataset.view){view=b.dataset.view;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render();return;}const a=b.dataset.action,id=b.dataset.id;if(!a||!key)return;try{if(a==='newSite')openSite();if(a==='newTask')openTask();if(a==='editSite')openSite(id);if(a==='editTask')openTask(id);if(a==='newSiteTask')openTask(null,id);if(a==='copyAccount')await copy(data.sites.find(s=>s.id===id).account);if(a==='copyPassword')await copy(data.sites.find(s=>s.id===id).password);if(a==='toggle'){const t=data.tasks.find(t=>t.id===id);t.status=t.status==='open'?'done':'open';await persist();render();}if(a==='deleteTask'&&confirm('删除这份作业？')){data.tasks=data.tasks.filter(t=>t.id!==id);await persist();render();}if(a==='deleteSite'&&confirm('删除网站？关联作业会保留，但取消网站关联。')){data.sites=data.sites.filter(s=>s.id!==id);data.tasks.forEach(t=>{if(t.siteId===id)t.siteId='';});await persist();render();}}catch(err){toast('操作未保存：'+err.message);}});
$('#siteForm').addEventListener('submit',async e=>{e.preventDefault();try{const values=Object.fromEntries(new FormData(e.target));values.url=safeUrl(values.url);values.assignmentUrl=safeUrl(values.assignmentUrl);if(!values.name.trim())throw Error('请输入网站名称');const existing=data.sites.find(s=>s.id===values.id);values.id=values.id||uid();values.integration=existing?.integration||{mode:'manual',adapterId:null,lastSyncAt:null};const i=data.sites.findIndex(s=>s.id===values.id);if(i<0)data.sites.push(values);else data.sites[i]=values;await persist();$('#siteDialog').close();e.target.reset();render();toast('网站已保存');}catch(err){toast(err.message);}});
$('#taskForm').addEventListener('submit',async e=>{e.preventDefault();try{const values=Object.fromEntries(new FormData(e.target));values.url=safeUrl(values.url);values.due=values.due?new Date(values.due).toISOString():'';const old=data.tasks.find(t=>t.id===values.id);values.id=values.id||uid();values.source=old?.source||'manual';values.externalId=old?.externalId||null;const i=data.tasks.findIndex(t=>t.id===values.id);if(i<0)data.tasks.push(values);else data.tasks[i]=values;await persist();$('#taskDialog').close();e.target.reset();render();toast('作业已保存');}catch(err){toast(err.message);}});
$('#addSiteBtn').onclick=()=>openSite();$('#addTaskBtn').onclick=()=>openTask();$('#lockBtn').onclick=lock;['search','categoryFilter','statusFilter'].forEach(id=>$('#'+id).addEventListener('input',render));
$('#exportBtn').onclick=async()=>{try{await saveQueue;const blob=new Blob([JSON.stringify(envelope,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`课桌-加密备份-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('已导出加密备份，恢复时仍需主密码');}catch(err){toast(err.message);}};
$('#importBtn').onclick=()=>$('#backupInput').click();$('#backupInput').onchange=async e=>{const f=e.target.files[0];if(!f)return;try{if(f.size>10*1024*1024)throw Error('备份文件过大');const imported=validateEnvelope(JSON.parse(await f.text()));if(!confirm('导入会替换当前资料库。请先导出当前备份；导入后需使用该备份的主密码。'))return;await saveQueue.catch(()=>{});localStorage.setItem(STORAGE_KEY,JSON.stringify(imported));await lock();toast('备份已导入，请用原主密码解锁');}catch(err){toast('导入失败：'+err.message);}finally{e.target.value='';}};
$('#demoBtn').onclick=async()=>{if(data.sites.some(s=>s.demo)){toast('示例已存在');return;}const sid=uid();data.sites.push({id:sid,name:'示例课程平台',url:'https://example.com/',assignmentUrl:'',category:'课程',purpose:'示例：看课件与提交作业',account:'示例学号',password:'',notes:'请替换成你实际使用的网站。',demo:true,integration:{mode:'manual',adapterId:null,lastSyncAt:null}});data.tasks.push({id:uid(),siteId:sid,title:'示例：完成运动学练习',course:'大学物理',due:new Date(Date.now()+48*3600000).toISOString(),status:'open',url:'',notes:'这是一条示例任务，可以编辑或删除。',source:'manual',externalId:null});try{await persist();render();toast('示例已添加');}catch(err){toast(err.message);}};
// Adapter boundary: parsing stays separate from persistence; candidates always require user confirmation.
function parseTaskText(text){return text.split(/\r?\n/).map(s=>s.trim()).filter(Boolean).slice(0,100).map(line=>{const m=line.match(/(20\d{2})[-年/.](\d{1,2})[-月/.](\d{1,2})日?(?:\s*(\d{1,2}):(\d{2}))?/);let due='';if(m){const y=+m[1],month=+m[2],day=+m[3],h=m[4]===undefined?23:+m[4],min=m[5]===undefined?59:+m[5],d=new Date(y,month-1,day,h,min);if(d.getFullYear()===y&&d.getMonth()===month-1&&d.getDate()===day&&h<24&&min<60)due=localDate(d);}return {title:line,due};});}
$('#readTasksBtn').onclick=()=>{siteSelect($('#readerSite'));$('#readerText').value='';$('#readerResults').innerHTML='';candidates=[];$('#readerDialog').showModal();};
$('#readerForm').onsubmit=e=>{e.preventDefault();candidates=parseTaskText($('#readerText').value);$('#readerResults').innerHTML=candidates.map((t,i)=>`<div class="candidate"><label><input type="checkbox" data-candidate="${i}" checked><span>${esc(t.title)}</span></label><input type="datetime-local" aria-label="候选作业截止时间" data-due="${i}" value="${esc(t.due)}"></div>`).join('')+(candidates.length?'<button type="button" class="primary" id="confirmCandidates" style="margin-top:16px">确认并加入清单</button>':'<p class="muted">先粘贴网页上的作业文字。</p>');};
$('#readerResults').onclick=async e=>{if(e.target.id!=='confirmCandidates')return;try{const selected=[...document.querySelectorAll('[data-candidate]:checked')];if(!selected.length){toast('请选择至少一份作业');return;}for(const input of selected){const i=+input.dataset.candidate,due=document.querySelector(`[data-due="${i}"]`).value;data.tasks.push({id:uid(),siteId:$('#readerSite').value,title:candidates[i].title,course:'',due:due?new Date(due).toISOString():'',status:'open',url:'',notes:'',source:'text',externalId:null});}await persist();$('#readerDialog').close();$('#readerResults').innerHTML='';$('#readerText').value='';candidates=[];render();toast(`已导入 ${selected.length} 份作业`);}catch(err){toast(err.message);}};
// Extension registration for a later localhost service or browser extension. No credentials enter this API.
window.StudyDeskAdapters={version:1,registry:new Map(),register(id,adapter){if(typeof id!=='string'||typeof adapter?.readTasks!=='function')throw Error('适配器需要 readTasks 方法');this.registry.set(id,adapter);},parseTaskText};
['pointerdown','keydown'].forEach(event=>document.addEventListener(event,touch));
render();showVault();

// Optional agent tools expose task metadata only; credentials are never returned.
if(document.modelContext?.registerTool){
 const lifecycle=new AbortController();
 const tools=[
  {name:'read_tasks',description:'Read the unlocked homework list. Does not expose account credentials.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute(input){if(!key)throw Error('资料库已锁定');if(!input||Object.keys(input).length)throw Error('不接受参数');return {tasks:data.tasks.map(({id,title,course,due,status,siteId})=>({id,title,course,due,status,siteId}))};}},
  {name:'start_task_creation',description:'Open the homework form; the user reviews and saves it.',inputSchema:{type:'object',properties:{},additionalProperties:false},execute(input){if(!key)throw Error('资料库已锁定');if(!input||Object.keys(input).length)throw Error('不接受参数');openTask();return {opened:true};}}
 ];
 for(const tool of tools){try{Promise.resolve(document.modelContext.registerTool(tool,{signal:lifecycle.signal})).catch(()=>{});}catch{}}
 window.addEventListener('pagehide',()=>lifecycle.abort(),{once:true});
}
</script></body></html>
